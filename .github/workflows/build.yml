name: Build Vishal X Opt

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore VishalXOpt.sln

      - name: Build (Release)
        run: dotnet build VishalXOpt.sln -c Release --no-restore

      - name: Publish (win-x64, framework-dependent)
        run: >
          dotnet publish src/VishalXOpt/VishalXOpt.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -o publish/win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VishalXOpt-win-x64
          path: publish/win-x64/**
          if-no-files-found: error

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath VishalXOpt-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VishalXOpt-win-x64.zip
          generate_release_notes: true
